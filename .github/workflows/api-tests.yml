name: API Tests + Allure Report

on:
  push:
    branches: [ main, develop, develop2 ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PR и push в develop/develop2 — быстрый smoke-набор.
      # -n 4: 4 vCPU у ubuntu-latest; больше воркеров смысла нет.
      - name: Run smoke tests
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
        run: |
          pytest -v -m smoke -n 4 --alluredir=allure_results --clean-alluredir

      # Слияние в main — полный прогон.
      - name: Run all tests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          pytest -v -n 4 --alluredir=allure_results --clean-alluredir

      - name: Install Allure CLI
        if: ${{ !cancelled() }}
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: allure generate allure_results -o allure-report --clean

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure_results/
          if-no-files-found: ignore

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy Allure report
    needs: tests
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
